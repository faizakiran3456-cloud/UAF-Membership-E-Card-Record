<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Department of Library, UAF – E-Card Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dcecfa; --bg2:#eaf4fd; --card:#ffffff; --ink:#0f2a47; --muted:#4d6784;
  --line:#b9d3ea; --accent:#1d5fa6; --accent-ink:#ffffff; --ok:#1f7a4d; --warn:#9a5b00;
  --head:#123a66; --head-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b2b; --bg2:#12253a; --card:#172f48; --ink:#e7f1fb; --muted:#9db6cf;
    --line:#29496b; --accent:#6db3f2; --accent-ink:#0b1a2b; --ok:#6fd3a2; --warn:#f0b866;
    --head:#0a2340; --head-ink:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b2b; --bg2:#12253a; --card:#172f48; --ink:#e7f1fb; --muted:#9db6cf;
  --line:#29496b; --accent:#6db3f2; --accent-ink:#0b1a2b; --ok:#6fd3a2; --warn:#f0b866;
  --head:#0a2340; --head-ink:#ffffff;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
header{background:var(--head);color:var(--head-ink);padding:18px 20px}
.bar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{flex:none;width:84px;height:84px;border-radius:14px;padding:4px;background:#fff;color:var(--head);display:grid;place-items:center;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:22px;border:3px solid rgba(255,255,255,.55);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.dept{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:clamp(20px,4.6vw,30px);line-height:1.2}
.sub{margin:4px 0 0;font-size:clamp(14px,3.4vw,17px);opacity:.88}
main{max-width:920px;margin:0 auto;padding:26px 20px 40px}
.search{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:10px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);letter-spacing:.02em}
input[type=search]:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--line)}
.hint{margin:10px 0 0;color:var(--muted);font-size:15px}
#status{margin:22px 0 10px;color:var(--muted);font-weight:600}
.result{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.result h2{margin:0 0 2px;font-family:"Source Serif 4",Georgia,serif;font-size:22px}
.reg{color:var(--accent);font-weight:700;font-size:18px;margin:0 0 10px}
dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 14px}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
mark{background:rgba(255,205,60,.55);color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:1px 10px;border-radius:99px;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.none{color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
footer{max-width:920px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:14px}

.tabs{display:flex;gap:8px;margin:0 0 16px}
.tab{flex:1;padding:12px 10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--head);color:var(--head-ink);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg2)}
td.n{color:var(--muted)} td.r{font-weight:600;white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:520px){dl{grid-template-columns:1fr;gap:0}dt{margin-top:8px;font-size:14px}.logo{width:62px;height:62px}button{padding:0 14px}}

.searchbox{margin-bottom:14px}
.count{margin:0 0 10px;color:var(--muted);font-weight:600;min-height:1.5em}
td.p{white-space:nowrap}
.sm{color:var(--muted);font-size:14px}
.all{padding:10px 18px;background:transparent;color:var(--accent);border:2px solid var(--accent)}
.all[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const dash = v => v ? esc(v) : '<span class="sm">—</span>';

STUDENTS.forEach(r => r._k = norm(r.reg));
STAFF.forEach(r => r._k = norm(r.name+' '+r.d1+' '+r.d2+' '+r.dept));

let allS=false, allF=false;
function renderS(){
  const q = norm($('qs').value);
  $('ws').hidden = !(q || allS);
  const rows = STUDENTS.filter(r => !q || r._k.includes(q));
  $('bs').innerHTML = rows.length ? rows.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r.name)}</td><td class="r">${esc(r.reg)}</td><td>${dash(r.cls)}</td><td>${dash(r.email)}</td><td class="p">${dash(r.date)}</td><td>${r.ecard?'<span class="tag ok">'+esc(r.ecard)+'</span>'+(r.note?' <span class="tag none">'+esc(r.note)+'</span>':''):'<span class="sm">—</span>'}</td></tr>`).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:22px">No student found. Check the number and try again.</td></tr>';
  $('ns').textContent = q ? (rows.length===1?'1 record found':rows.length+' records found') : '';
}
function renderF(){
  const raw = $('qf').value.trim(), q = norm(raw);
  $('wf').hidden = !(q || allF);
  const rows = STAFF.filter(r => !q || r._k.includes(q));
  $('bf').innerHTML = rows.length ? rows.map((r,i)=>{
    const des = esc(r.d1||'') + (r.d2 ? `<div class="sm">Also: ${esc(r.d2)}</div>` : '');
    return `<tr><td class="n">${i+1}</td><td class="r" style="white-space:normal">${esc(r.name)}</td><td>${des||'<span class="sm">—</span>'}</td><td>${dash(r.dept)}</td><td class="p">${dash(r.pno)}</td><td class="p">${dash(r.date)}</td></tr>`;
  }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:22px">No member found. Try a different name or designation.</td></tr>';
  $('nf').textContent = q ? (rows.length===1?'1 record found':rows.length+' records found') : '';
}
function show(f){
  $('viewS').hidden = f; $('viewF').hidden = !f;
  $('tabS').setAttribute('aria-selected', !f); $('tabF').setAttribute('aria-selected', f);
}
$('tabS').onclick=()=>show(false); $('tabF').onclick=()=>show(true);
$('qs').addEventListener('input',renderS); $('qf').addEventListener('input',renderF);
$('cs').onclick=()=>{$('qs').value='';renderS();$('qs').focus()};
$('cf').onclick=()=>{$('qf').value='';renderF();$('qf').focus()};
function toggle(which){
  if(which==='s'){ allS=!allS; $('as').setAttribute('aria-pressed',allS); $('as').textContent=allS?'Hide all records':'View all records'; renderS(); }
  else { allF=!allF; $('af').setAttribute('aria-pressed',allF); $('af').textContent=allF?'Hide all records':'View all records'; renderF(); }
}
$('as').onclick=()=>toggle('s'); $('af').onclick=()=>toggle('f');
renderS(); renderF();
